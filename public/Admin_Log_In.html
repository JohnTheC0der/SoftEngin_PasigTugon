<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasig Tugon! - Admin Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="PasigTugon_Logo.png">

    <style>
        :root {
            --primary-blue: #0e48a1;
            --light-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --btn-hover-blue: #1d4ed8;
            --white: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.18);
            --input-bg: rgba(255, 255, 255, 0.95);
            --error-red: #fca5a5;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: rgba(239, 68, 68, 0.3);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(14, 72, 161, 0.4), rgba(15, 23, 42, 0.8)),
                url('background.png') center/cover no-repeat fixed;
            color: var(--white);
            padding: 24px;
        }

        /* CARD CONTAINER WITH GLASSMORPHISM */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* CITY SEAL LOGO */
        .logo-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .city-seal {
            width: 85px;
            height: 85px;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.35));
            transition: var(--transition);
        }

        .city-seal:hover {
            transform: scale(1.06) rotate(2deg);
        }

        /* BRANDING TITLES */
        .brand-title {
            font-weight: 900;
            font-size: clamp(2.4rem, 4.5vw, 3rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 8px;
        }

        .brand-title .blue-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
        }

        .brand-title .white-text {
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .sub-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-bottom: 32px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* FORM STYLING */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.03em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            font-size: 0.98rem;
            font-family: inherit;
            color: #0f172a;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 50px;
            outline: none;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .input-wrapper .input-field {
            padding-right: 48px;
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field:focus {
            border-color: var(--accent-cyan);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: #0f172a;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        /* LOGIN ERROR MESSAGE */
        .error-text {
            display: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--error-red);
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
        }

        /* SUBMIT BUTTON */
        .login-btn {
            width: 100%;
            margin-top: 8px;
            padding: 16px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--white);
            background: var(--light-blue);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn svg {
            width: 20px;
            height: 20px;
            transition: var(--transition);
        }

        .login-btn:hover {
            background: var(--btn-hover-blue);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .login-btn:hover svg {
            transform: scale(1.15);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: var(--white);
        }

        /* FOOTER / SIGN-UP LINK */
        .form-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            text-align: center;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.03em;
        }

        .form-footer a {
            color: var(--accent-cyan);
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
        }

        .form-footer a:hover {
            text-decoration: underline;
            color: var(--white);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }

            .brand-title {
                font-size: 2.2rem;
            }

            .sub-title {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">
        <!-- City Seal Logo -->
        <div class="logo-wrapper">
            <img src="pasig_logo.webp" alt="Pasig City Seal" class="city-seal">
        </div>

        <!-- Title Header -->
        <h1 class="brand-title">
            <span class="blue-text">PASIG</span> <span class="white-text">TUGON!</span>
        </h1>
        <p class="sub-title">Admin Login Station</p>

        <!-- Login Form -->
        <form class="login-form" id="login-form" action="#" method="POST">
            <div class="input-group">
                <label for="username" class="input-label">Username</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username"
                    required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password" class="input-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="input-field"
                        placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="toggle-password-btn"
                        title="Toggle Password Visibility">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <p id="login-error" class="error-text"></p>

            <button type="submit" class="login-btn" id="login-submit-btn">
                <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <span id="btn-text">Log In</span>
            </button>
        </form>

        <p class="form-footer">
            No account yet? <a href="Admin_Sign_Up.html">Sign up here</a>
        </p>
    </main>

    <script>
        // Password Visibility Toggle
        var passwordInput = document.getElementById('password');
        var toggleBtn = document.getElementById('toggle-password-btn');
        var eyeIcon = document.getElementById('eye-icon');

        toggleBtn.addEventListener('click', function () {
            var isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

            eyeIcon.innerHTML = isPassword
                ? '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.03 10.03 0 013.122-.813c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-1.22 1.22L3 3l18 18" />'
                : '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
        });

        // Form Submit Handler
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorEl = document.getElementById('login-error');
            var submitBtn = document.getElementById('login-submit-btn');
            var btnText = document.getElementById('btn-text');

            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            btnText.textContent = 'Logging in...';

            fetch('../src/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.success) {
                        window.location.href = (data.status === 'approved')
                            ? 'Admin_Dashboard_Page.php'
                            : 'Admin_Wait_Page.html';
                    } else {
                        errorEl.textContent = data.message || 'Invalid username or password.';
                        errorEl.style.display = 'block';
                        submitBtn.disabled = false;
                        btnText.textContent = 'Log In';
                    }
                })
                .catch(function () {
                    errorEl.textContent = 'Could not reach the server. Please check your connection and try again.';
                    errorEl.style.display = 'block';
                    submitBtn.disabled = false;
                    btnText.textContent = 'Log In';
                });
        });
    </script>

</body>

</html>
