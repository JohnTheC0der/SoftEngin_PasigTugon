<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasig Tugon! - Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="PasigTugon_Logo.png">


    <style>
        :root {
            --primary-blue: #0e48a1;
            --light-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --btn-hover-blue: #1d4ed8;
            --white: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.18);
            --input-bg: rgba(255, 255, 255, 0.95);
            --error-red: #fca5a5;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Updated to use local background.png with color overlay */
            background: url('background.png') center/cover no-repeat fixed;
            color: var(--white);
            padding: 20px;
        }

        /* CARD CONTAINER WITH GLASSMORPHISM */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* CITY SEAL LOGO */
        .city-seal {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 16px;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
            transition: var(--transition);
        }

        .city-seal:hover {
            transform: scale(1.05);
        }

        /* BRANDING TITLES */
        .brand-title {
            font-weight: 900;
            font-size: clamp(2.4rem, 4.5vw, 3rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .brand-title .blue-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .brand-title .white-text {
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .sub-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        /* FORM STYLING */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.03em;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            font-size: 0.98rem;
            font-family: inherit;
            color: #0f172a;
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 50px;
            outline: none;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field:focus {
            border-color: var(--accent-cyan);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
        }

        /* LOGIN ERROR MESSAGE */
        .error-text {
            display: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--error-red);
            text-align: center;
            margin-top: -8px;
        }

        /* SUBMIT BUTTON */
        .login-btn {
            width: 100%;
            padding: 16px 24px;
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--white);
            background: var(--light-blue);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .login-btn:hover {
            background: var(--btn-hover-blue);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* FOOTER / SIGN-UP LINK */
        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-footer a {
            color: var(--accent-cyan);
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
        }

        .form-footer a:hover {
            text-decoration: underline;
            color: var(--white);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }

            .brand-title {
                font-size: 2.2rem;
            }

            .sub-title {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">
        <!-- City Seal Logo -->
        <img src="pasig_logo.webp" alt="Pasig City Seal" class="city-seal">

        <!-- Title Header -->
        <h1 class="brand-title">
            <span class="blue-text">PASIG</span> <span class="white-text">TUGON!</span>
        </h1>
        <p class="sub-title">Admin Login Station</p>

        <!-- Login Form -->
        <form class="login-form" id="login-form" action="#" method="POST">
            <div class="input-group">
                <label for="username" class="input-label">Username</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username"
                    required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password" class="input-label">Password</label>
                <input type="password" id="password" name="password" class="input-field"
                    placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <p id="login-error" class="error-text"></p>

            <button type="submit" class="login-btn" id="login-submit-btn">Log In</button>
        </form>

        <p class="form-footer">
            No account yet? <a href="Admin_Sign_Up.html">Sign in here</a>
        </p>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorEl = document.getElementById('login-error');
            var submitBtn = document.getElementById('login-submit-btn');

            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            // Adjust this path if your folder structure differs —
            // this assumes public/Admin_Log_In.html and src/login.php as siblings.
            fetch('../src/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.success) {
                        // approved barangays go straight to the dashboard,
                        // pending ones go to the wait page which polls their status
                        window.location.href = (data.status === 'approved')
                            ? 'Admin_Dashboard_Page.html'
                            : 'Admin_Wait_Page.html';
                    } else {
                        errorEl.textContent = data.message;
                        errorEl.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Log In';
                    }
                })
                .catch(function () {
                    errorEl.textContent = 'Could not reach the server. Please try again.';
                    errorEl.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Log In';
                });
        });
    </script>

</body>

</html>
