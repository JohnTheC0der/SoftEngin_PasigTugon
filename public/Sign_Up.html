<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="Pasig Tugon! Citizen Concern Station - report and track concerns in Pasig City. Sign up as a citizen or barangay staff.">
    <meta name="theme-color" content="#0e48a1">
    <meta name="color-scheme" content="dark">
    <title>Pasig Tugon! - Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="PasigTugon_Logo.png">
    <link rel="apple-touch-icon" href="PasigTugon_Logo.png">

    <style>
        :root {
            --primary-blue: #0e48a1;
            --light-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --btn-hover-blue: #1d4ed8;
            --white: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --danger: #dc2626;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.18);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --safe-area-top: max(env(safe-area-inset-top, 0px), 0px);
            --safe-area-bottom: max(env(safe-area-inset-bottom, 0px), 0px);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(14, 72, 161, 0.4), rgba(15, 23, 42, 0.8)),
                radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.15), transparent 50%);
            background-color: #0f172a;
            background-attachment: fixed;
            color: var(--white);
            padding: 24px;
            padding-top: max(24px, var(--safe-area-top));
            padding-bottom: max(24px, var(--safe-area-bottom));
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        :focus-visible {
            outline: 3px solid var(--accent-cyan);
            outline-offset: 3px;
        }

        /* ── Card ── */
        .menu-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-wrapper {
            margin-bottom: 20px;
        }

        .city-seal {
            width: 96px;
            height: 96px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
            transition: var(--transition);
            display: block;
        }

        .city-seal:hover {
            transform: scale(1.06) rotate(2deg);
        }

        .brand-title {
            font-weight: 900;
            font-size: clamp(2.2rem, 9vw, 3.2rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .brand-title .blue-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
        }

        .brand-title .white-text {
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .sub-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 36px;
            padding: 8px 18px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        /* ── Buttons ── */
        .action-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-btn {
            padding: 20px 24px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--white);
            background: var(--light-blue);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .menu-btn svg {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            transition: var(--transition);
            stroke-width: 1.5;
        }

        .menu-btn .btn-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .menu-btn .btn-title {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .menu-btn small {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            text-transform: none;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.4;
        }

        .menu-btn:hover {
            background: var(--btn-hover-blue);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .menu-btn:hover::before {
            opacity: 1;
        }

        .menu-btn:hover svg {
            transform: scale(1.1);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .menu-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.5), 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .menu-btn.alt-btn {
            background: var(--primary-blue);
            box-shadow: 0 10px 20px -5px rgba(14, 72, 161, 0.5);
        }

        .menu-btn.alt-btn:hover {
            background: #0b3a85;
            box-shadow: 0 15px 30px -5px rgba(14, 72, 161, 0.7);
        }

        /* ── Footer ── */
        .menu-foot {
            margin-top: 32px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .menu-foot a {
            color: var(--accent-cyan);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            display: inline-block;
        }

        .menu-foot a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        .menu-foot a:focus-visible {
            outline-offset: 2px;
        }

        /* ── Loading State ── */
        .menu-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .menu-btn.loading svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .menu-card {
                padding: 40px 28px;
                border-radius: 24px;
            }

            .brand-title {
                font-size: clamp(1.8rem, 8vw, 2.6rem);
            }

            .sub-title {
                font-size: 0.78rem;
                margin-bottom: 28px;
            }

            .menu-btn {
                padding: 18px 20px;
                gap: 14px;
            }

            .menu-btn svg {
                width: 44px;
                height: 44px;
            }

            .menu-btn .btn-title {
                font-size: 0.9rem;
            }

            .menu-btn small {
                font-size: 0.72rem;
            }

            .action-group {
                gap: 12px;
            }
        }

        @media (max-width: 380px) {
            .menu-card {
                padding: 32px 20px;
                border-radius: 20px;
            }

            .logo-wrapper {
                margin-bottom: 16px;
            }

            .city-seal {
                width: 80px;
                height: 80px;
            }

            .brand-title {
                font-size: clamp(1.6rem, 7vw, 2.2rem);
                margin-bottom: 8px;
            }

            .sub-title {
                font-size: 0.7rem;
                margin-bottom: 24px;
            }

            .menu-btn svg {
                width: 40px;
                height: 40px;
            }

            .menu-foot {
                margin-top: 24px;
                gap: 8px;
                font-size: 0.78rem;
            }
        }

        /* ── Reduced Motion ── */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        /* ── Dark Mode (default) ── */
        @media (prefers-color-scheme: light) {
            body {
                background: linear-gradient(135deg, rgba(14, 72, 161, 0.2), rgba(255, 255, 255, 0.9)),
                    radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.1), transparent 50%);
                background-color: #f8fafc;
                color: var(--ink);
            }

            .menu-card {
                background: rgba(255, 255, 255, 0.8);
                border-color: rgba(14, 72, 161, 0.15);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1),
                    0 0 0 1px rgba(0, 0, 0, 0.05),
                    inset 0 1px 0 0 rgba(255, 255, 255, 0.5);
            }

            .brand-title .white-text {
                color: var(--ink);
            }

            .sub-title {
                color: rgba(15, 23, 42, 0.85);
                background: rgba(37, 99, 235, 0.08);
                border-color: rgba(37, 99, 235, 0.2);
            }

            .menu-btn {
                color: var(--white);
                border-color: rgba(37, 99, 235, 0.3);
            }

            .menu-btn small {
                color: rgba(255, 255, 255, 0.85);
            }

            .menu-foot {
                color: rgba(15, 23, 42, 0.7);
            }

            .menu-foot a {
                color: var(--light-blue);
            }

            .menu-foot a:hover {
                color: var(--primary-blue);
            }
        }
    </style>
</head>

<body>
    <main class="menu-card">
        <div class="logo-wrapper">
            <img src="pasig_logo.webp" alt="Pasig City Seal" class="city-seal" width="96" height="96" loading="lazy">
        </div>

        <h1 class="brand-title">
            <span class="blue-text">Pasig</span> <span class="white-text">Tugon!</span>
        </h1>
        <p class="sub-title">Create an Account</p>

        <nav class="action-group" aria-label="Account type selection">
            <a href="Citizen_Sign_Up.html" class="menu-btn" role="button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="btn-text">
                    <span class="btn-title">Citizen</span>
                    <small>Report concerns to your barangay and track their progress. Ready to use right away.</small>
                </span>
            </a>

            <a href="Staff_Sign_Up.html" class="menu-btn alt-btn" role="button">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <span class="btn-text">
                    <span class="btn-title">Barangay Staff</span>
                    <small>Official @pasigcity.gov.ph email required. A super admin approves your account.</small>
                </span>
            </a>
        </nav>

        <div class="menu-foot">
            <span>Already have an account? <a href="Sign_In.html">Sign in</a></span>
            <span><a href="main_menu.html">&larr; Back to main menu</a></span>
        </div>

    </main>

    <script>
        // Image error handling with graceful fallback
        (function () {
            const seal = document.querySelector('.city-seal');
            if (!seal) return;

            seal.addEventListener('error', function () {
                seal.style.opacity = '0';
                seal.style.visibility = 'hidden';
                seal.style.width = '0';
                seal.style.height = '0';
            });

            // Preload logo for better perceived performance
            if ('requestIdleCallback' in window) {
                requestIdleCallback(() => {
                    const img = new Image();
                    img.src = seal.src;
                });
            }
        })();

        // Optional: Add smooth scroll behavior for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>

</html>
