<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pasig Tugon! Citizen Concern Station - report and track concerns in Pasig City.">
    <meta name="theme-color" content="#0e48a1">
    <title>Pasig Tugon! - Citizen Concern Station</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="PasigTugon_Logo.png">

    <style>
        :root {
            --accent-cyan: #38bdf8;
            --white: #ffffff;
            --transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            background-image: linear-gradient(135deg, rgba(14, 72, 161, 0.4), rgba(15, 23, 42, 0.8)),
                url('background.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--white);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 3px solid var(--accent-cyan);
            outline-offset: 3px;
        }

        /* ── Page wrapper ── */
        .page-wrapper {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        /* ── Header ── */
        .header-card {
            background: rgba(10, 20, 50, 0.55);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: none;
            border-radius: 28px 28px 0 0;
            padding: 40px 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .seal-ring {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .seal-ring:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.28);
        }

        .city-seal {
            width: 72px;
            height: 72px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            transition: var(--transition);
        }

        .city-seal:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .brand-title {
            font-weight: 900;
            font-size: clamp(2.2rem, 8vw, 3.2rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 14px;
        }

        .brand-title .blue-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 28px rgba(56, 189, 248, 0.4);
        }

        .brand-title .white-text {
            color: var(--white);
        }

        .sub-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            padding: 6px 18px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ── Panels ── */
        .panels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
        }

        .panel-card {
            background: rgba(14, 60, 140, 0.5);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 170, 255, 0.2);
            border-top: none;
            padding: 40px 28px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }

        .panel-card:first-child {
            border-right: none;
        }

        .panel-card.alt {
            background: rgba(9, 42, 110, 0.5);
            border-color: rgba(80, 140, 200, 0.18);
        }

        .panel-card:hover {
            background: rgba(37, 99, 235, 0.55);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .panel-card.alt:hover {
            background: rgba(14, 60, 140, 0.6);
            border-color: rgba(100, 160, 220, 0.35);
        }

        /* ── Icon circle ── */
        .icon-circle {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .icon-circle.primary {
            background: rgba(56, 189, 248, 0.12);
            border: 2px solid rgba(56, 189, 248, 0.3);
        }

        .icon-circle.secondary {
            background: rgba(148, 163, 184, 0.1);
            border: 2px solid rgba(148, 163, 184, 0.22);
        }

        .panel-card:hover .icon-circle {
            transform: scale(1.1);
        }

        .panel-card:hover .icon-circle.primary {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .panel-card:hover .icon-circle.secondary {
            background: rgba(148, 163, 184, 0.18);
            border-color: rgba(148, 163, 184, 0.38);
        }

        .icon-circle svg {
            width: 44px;
            height: 44px;
        }

        .panel-label {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--white);
            margin-bottom: 10px;
        }

        .panel-desc {
            font-size: 0.78rem;
            font-weight: 500;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.65);
        }

        /* ── Footer strip ── */
        .footer-strip {
            background: rgba(8, 16, 40, 0.5);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: none;
            border-radius: 0 0 28px 28px;
            padding: 14px 24px;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.45);
        }

        .footer-strip span {
            margin: 0 8px;
        }

        .footer-strip a {
            color: var(--accent-cyan);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-strip a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .panels-grid {
                grid-template-columns: 1fr;
            }

            .panel-card:first-child {
                border-right: 1px solid rgba(100, 170, 255, 0.2);
                border-bottom: none;
            }

            .header-card {
                padding: 30px 24px 24px;
            }

            .seal-ring {
                width: 80px;
                height: 80px;
            }

            .city-seal {
                width: 58px;
                height: 58px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="page-wrapper">

        <!-- Header -->
        <div class="header-card">
            <div class="seal-ring">
                <img src="pasig_logo.webp" alt="Pasig City Seal" class="city-seal" width="72" height="72">
            </div>
            <h1 class="brand-title">
                <span class="blue-text">Pasig</span> <span class="white-text">Tugon!</span>
            </h1>
            <span class="sub-title">Citizen Concern Station</span>
        </div>

        <!-- Two large panels -->
        <nav class="panels-grid" aria-label="Main menu">

            <a href="Sign_In.html" class="panel-card">
                <div class="icon-circle primary" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#38bdf8"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                </div>
                <div class="panel-label">Sign In</div>
                <p class="panel-desc">Access your account and continue tracking your reported concerns.</p>
            </a>

            <a href="Sign_Up.html" class="panel-card alt">
                <div class="icon-circle secondary" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="rgba(148,163,184,0.9)" stroke-width="1.6" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <line x1="19" y1="8" x2="19" y2="14" />
                        <line x1="22" y1="11" x2="16" y2="11" />
                    </svg>
                </div>
                <div class="panel-label">Sign Up</div>
                <p class="panel-desc">Create a new account to start reporting concerns in your barangay.</p>
            </a>

        </nav>

        <!-- Footer strip -->
        <div class="footer-strip">
            <span>Pasig City Government</span>·<span>pasigcity.gov.ph</span>·<span><a href="help.html">Help</a></span>
        </div>

    </main>

    <script>
        (function () {
            var seal = document.querySelector('.city-seal');
            if (!seal) return;
            seal.addEventListener('error', function () {
                seal.closest('.seal-ring').style.fontSize = '44px';
                seal.closest('.seal-ring').textContent = '🏛️';
            });
        })();
    </script>
</body>

</html>
