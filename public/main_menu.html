<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pasig Tugon! Citizen Concern Station - report and track concerns in Pasig City.">
    <meta name="theme-color" content="#0e48a1">
    <title>Pasig Tugon! - Citizen Concern Station</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="PasigTugon_Logo.png">

    <style>
        :root {
            --primary-blue: #0e48a1;
            --light-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --btn-hover-blue: #1d4ed8;
            --white: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --danger: #dc2626;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.18);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            background-image: linear-gradient(135deg, rgba(14, 72, 161, 0.4), rgba(15, 23, 42, 0.8)),
                url('background.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--white);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 3px solid var(--accent-cyan);
            outline-offset: 3px;
        }

        /* ── Card ── */
        .menu-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .logo-wrapper {
            margin-bottom: 20px;
        }

        .city-seal {
            width: 96px;
            height: 96px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
            transition: var(--transition);
        }

        .city-seal:hover {
            transform: scale(1.06) rotate(2deg);
        }

        .brand-title {
            font-weight: 900;
            font-size: clamp(2.2rem, 9vw, 3.2rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .brand-title .blue-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
        }

        .brand-title .white-text {
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .sub-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 36px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ── Buttons ── */
        .action-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            width: 100%;
            padding: 16px 28px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--white);
            background: var(--light-blue);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .menu-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .menu-btn:hover {
            background: var(--btn-hover-blue);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .menu-btn:hover svg {
            transform: scale(1.15);
        }

        .menu-btn:active {
            transform: translateY(-1px);
        }

        /* Raised contrast: the old 0.85-alpha blue nearly vanished on the glass card */
        .menu-btn.admin-btn {
            background: var(--primary-blue);
            box-shadow: 0 10px 20px -5px rgba(14, 72, 161, 0.5);
        }

        .menu-btn.admin-btn:hover {
            background: #0b3a85;
            box-shadow: 0 15px 25px -5px rgba(14, 72, 161, 0.7);
        }

        .super-admin-action-group {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .super-admin-link {
            font-family: inherit;
            background: none;
            border: 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .super-admin-link:hover {
            color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.07);
        }

        .super-admin-link svg {
            width: 16px;
            height: 16px;
        }

        /* ── Native <dialog> (replaces jQuery UI) ── */
        .key-dialog {
            margin: auto;
            width: min(380px, calc(100% - 32px));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 0;
            background: #ffffff;
            color: var(--ink);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .key-dialog::backdrop {
            background: rgba(15, 23, 42, 0.7);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }

        .key-dialog[open] {
            animation: dialog-in 0.2s ease-out;
        }

        @keyframes dialog-in {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .key-dialog form {
            padding: 24px;
            text-align: center;
        }

        .dialog-icon {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: var(--light-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .dialog-title {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .dialog-text {
            font-size: 0.875rem;
            color: var(--muted);
            line-height: 1.4;
        }

        .form-group {
            margin-top: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            padding: 12px 44px 12px 14px;
            color: var(--ink);
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--light-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .form-input.invalid {
            border-color: var(--danger);
        }

        .toggle-key-btn {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 0;
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
        }

        .toggle-key-btn:hover {
            color: var(--ink);
            background: #e2e8f0;
        }

        .error-message {
            margin-top: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--danger);
            min-height: 1.2em;
        }

        .dialog-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .dialog-actions button {
            flex: 1;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 12px 16px;
            border-radius: 12px;
            border: 0;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            color: #fff;
            background: var(--primary-blue);
            box-shadow: 0 4px 12px rgba(14, 72, 161, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--btn-hover-blue);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            color: #334155;
            background: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        @media (max-width: 480px) {
            .menu-card {
                padding: 36px 24px;
            }

            .sub-title {
                font-size: 0.72rem;
                letter-spacing: 0.14em;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="menu-card">
        <div class="logo-wrapper">
            <img src="pasig_logo.webp" alt="Pasig City Seal" class="city-seal" width="96" height="96">
        </div>

        <h1 class="brand-title">
            <span class="blue-text">Pasig</span> <span class="white-text">Tugon!</span>
        </h1>
        <p class="sub-title">Citizen Concern Station</p>

        <nav class="action-group" aria-label="Choose how to sign in">
            <a href="citizen_concern_station.html" class="menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                Citizens
            </a>

            <a href="Admin_Log_In.html" class="menu-btn admin-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                Admin
            </a>
        </nav>

        <div class="super-admin-action-group">
            <button type="button" id="openSuperAdminModal" class="super-admin-link" aria-haspopup="dialog">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
                Super Admin Access
            </button>
        </div>
    </main>

    <!-- ══════════════ SUPER ADMIN DIALOG ══════════════ -->
    <dialog id="super-admin-modal" class="key-dialog" aria-labelledby="dialogTitle" aria-describedby="dialogDesc">
        <form method="dialog" id="keyForm" novalidate>
            <div class="dialog-icon" aria-hidden="true">
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                </svg>
            </div>

            <h2 class="dialog-title" id="dialogTitle">Super Admin Authentication</h2>
            <p class="dialog-text" id="dialogDesc">Enter your security key to open the Super Admin Dashboard.</p>

            <div class="form-group">
                <label class="form-label" for="superAdminKey">Super Admin Key</label>
                <div class="input-wrapper">
                    <input class="form-input" type="password" id="superAdminKey" placeholder="Enter security key"
                        autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="keyErrorMsg">
                    <button type="button" class="toggle-key-btn" id="toggleKeyVisibility" aria-label="Show key"
                        aria-pressed="false">
                        <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24" aria-hidden="true"></svg>
                    </button>
                </div>
                <p id="keyErrorMsg" class="error-message" role="alert" aria-live="assertive"></p>
            </div>

            <div class="dialog-actions">
                <button type="button" class="btn-secondary" id="cancelKey">Cancel</button>
                <button type="submit" class="btn-primary" id="submitKey">Open dashboard</button>
            </div>
        </form>
    </dialog>

    <script>
        (function () {
            'use strict';

            /*
             * SECURITY NOTE: this check runs in the browser, so anyone can read or bypass it
             * (view source, or open Super_Admin_Dashboard.html directly). Hashing keeps the key
             * out of plain sight, but real protection must be enforced on your server:
             * verify the key there and check a session on the dashboard page/API.
             * SHA-256 of the current key; regenerate with: echo -n "yourkey" | sha256sum
             */
            var KEY_HASH = 'f58a3c1a46416b308fa9896e07daed6d7516c854f320f54e55fdd2b05f151630';
            var DASHBOARD_URL = 'Super_Admin_Dashboard.html';
            var MAX_ATTEMPTS = 5;
            var LOCKOUT_MS = 30000;

            var dialog = document.getElementById('super-admin-modal');
            var form = document.getElementById('keyForm');
            var input = document.getElementById('superAdminKey');
            var errorEl = document.getElementById('keyErrorMsg');
            var toggleBtn = document.getElementById('toggleKeyVisibility');
            var eyeIcon = document.getElementById('eyeIcon');
            var submitBtn = document.getElementById('submitKey');
            var openBtn = document.getElementById('openSuperAdminModal');

            var attempts = 0;
            var lockedUntil = 0;
            var lockTimer = null;

            var EYE = '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            var EYE_OFF = '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
            eyeIcon.innerHTML = EYE;

            function sha256Fallback(text) {
                var hash = [];
                var constants = [];
                var candidate = 2;

                while (constants.length < 64) {
                    var isPrime = true;
                    for (var divisor = 2; divisor * divisor <= candidate; divisor++) {
                        if (candidate % divisor === 0) {
                            isPrime = false;
                            break;
                        }
                    }
                    if (isPrime) {
                        if (hash.length < 8) hash.push((Math.sqrt(candidate) * 0x100000000) | 0);
                        constants.push((Math.pow(candidate, 1 / 3) * 0x100000000) | 0);
                    }
                    candidate++;
                }

                var encoded = unescape(encodeURIComponent(text));
                var bytes = [];
                for (var i = 0; i < encoded.length; i++) bytes.push(encoded.charCodeAt(i));
                var bitLength = bytes.length * 8;
                bytes.push(0x80);
                while (bytes.length % 64 !== 56) bytes.push(0);
                for (var shift = 56; shift >= 0; shift -= 8) {
                    bytes.push(Math.floor(bitLength / Math.pow(2, shift)) & 0xff);
                }

                function rotateRight(value, amount) {
                    return (value >>> amount) | (value << (32 - amount));
                }

                for (var offset = 0; offset < bytes.length; offset += 64) {
                    var words = [];
                    for (var j = 0; j < 16; j++) {
                        var index = offset + j * 4;
                        words[j] = (bytes[index] << 24) | (bytes[index + 1] << 16) |
                            (bytes[index + 2] << 8) | bytes[index + 3];
                    }
                    for (var k = 16; k < 64; k++) {
                        var x = words[k - 15];
                        var y = words[k - 2];
                        var s0 = rotateRight(x, 7) ^ rotateRight(x, 18) ^ (x >>> 3);
                        var s1 = rotateRight(y, 17) ^ rotateRight(y, 19) ^ (y >>> 10);
                        words[k] = (words[k - 16] + s0 + words[k - 7] + s1) | 0;
                    }

                    var a = hash[0], b = hash[1], c = hash[2], d = hash[3];
                    var e = hash[4], f = hash[5], g = hash[6], h = hash[7];
                    for (var n = 0; n < 64; n++) {
                        var sum1 = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
                        var choice = (e & f) ^ (~e & g);
                        var temp1 = (h + sum1 + choice + constants[n] + words[n]) | 0;
                        var sum0 = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
                        var majority = (a & b) ^ (a & c) ^ (b & c);
                        var temp2 = (sum0 + majority) | 0;
                        h = g; g = f; f = e; e = (d + temp1) | 0;
                        d = c; c = b; b = a; a = (temp1 + temp2) | 0;
                    }
                    hash[0] = (hash[0] + a) | 0; hash[1] = (hash[1] + b) | 0;
                    hash[2] = (hash[2] + c) | 0; hash[3] = (hash[3] + d) | 0;
                    hash[4] = (hash[4] + e) | 0; hash[5] = (hash[5] + f) | 0;
                    hash[6] = (hash[6] + g) | 0; hash[7] = (hash[7] + h) | 0;
                }

                return hash.map(function (value) {
                    return ('00000000' + (value >>> 0).toString(16)).slice(-8);
                }).join('');
            }

            function sha256Hex(text) {
                if (window.crypto && crypto.subtle && window.TextEncoder) {
                    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
                        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
                            return b.toString(16).padStart(2, '0');
                        }).join('');
                    });
                }
                return Promise.resolve(sha256Fallback(text));
            }

            function showError(msg) {
                errorEl.textContent = msg;
                input.classList.toggle('invalid', !!msg);
                input.setAttribute('aria-invalid', msg ? 'true' : 'false');
            }

            function setVisibility(visible) {
                input.type = visible ? 'text' : 'password';
                eyeIcon.innerHTML = visible ? EYE_OFF : EYE;
                toggleBtn.setAttribute('aria-pressed', String(visible));
                toggleBtn.setAttribute('aria-label', visible ? 'Hide key' : 'Show key');
            }

            function updateLockout() {
                var remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
                if (remaining > 0) {
                    submitBtn.disabled = true;
                    showError('Too many attempts. Try again in ' + remaining + 's.');
                    lockTimer = setTimeout(updateLockout, 500);
                } else {
                    clearTimeout(lockTimer);
                    lockedUntil = 0;
                    attempts = 0;
                    submitBtn.disabled = false;
                    showError('');
                }
            }

            function openDialog() {
                input.value = '';
                setVisibility(false);
                showError('');
                if (typeof dialog.showModal === 'function') {
                    dialog.showModal();
                } else {
                    dialog.setAttribute('open', '');
                }
                if (lockedUntil > Date.now()) updateLockout();
                input.focus();
            }

            function closeDialog() {
                input.value = '';
                if (typeof dialog.close === 'function') dialog.close();
                else dialog.removeAttribute('open');
                openBtn.focus();
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (lockedUntil > Date.now()) return;

                var entered = input.value.trim();
                if (!entered) {
                    showError('Enter your security key.');
                    input.focus();
                    return;
                }

                submitBtn.disabled = true;
                sha256Hex(entered).then(function (hash) {
                    if (hash === KEY_HASH) {
                        showError('');
                        window.location.href = DASHBOARD_URL;
                        return;
                    }
                    attempts += 1;
                    submitBtn.disabled = false;
                    if (attempts >= MAX_ATTEMPTS) {
                        lockedUntil = Date.now() + LOCKOUT_MS;
                        updateLockout();
                    } else {
                        showError('Incorrect key. ' + (MAX_ATTEMPTS - attempts) + ' attempt(s) left.');
                    }
                    input.select();
                }).catch(function (error) {
                    console.error('Super admin key verification failed:', error);
                    submitBtn.disabled = false;
                    showError('Could not verify the key. Please reload and try again.');
                });
            });

            input.addEventListener('input', function () {
                if (lockedUntil <= Date.now()) showError('');
            });

            toggleBtn.addEventListener('click', function () {
                setVisibility(input.type === 'password');
                input.focus();
            });

            openBtn.addEventListener('click', openDialog);
            document.getElementById('cancelKey').addEventListener('click', closeDialog);

            // Click on the backdrop closes the dialog
            dialog.addEventListener('click', function (e) {
                if (e.target === dialog) closeDialog();
            });

            // Clear the key when closed any way (Esc, Cancel, backdrop)
            dialog.addEventListener('close', function () {
                input.value = '';
            });

            // Fall back gracefully if the seal image is missing
            var seal = document.querySelector('.city-seal');
            seal.addEventListener('error', function () {
                seal.style.display = 'none';
            });
        })();
    </script>
</body>

</html>
