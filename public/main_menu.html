<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pasig Tugon! Citizen Concern Station - report and track concerns in Pasig City.">
    <meta name="theme-color" content="#0e48a1">
    <title>Pasig Tugon! - Citizen Concern Station</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="PasigTugon_Logo.png">

    <style>
        :root {
            --primary-blue: #0e48a1;
            --light-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --btn-hover-blue: #1d4ed8;
            --white: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --danger: #dc2626;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.18);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            background-image: linear-gradient(135deg, rgba(14, 72, 161, 0.4), rgba(15, 23, 42, 0.8)),
                url('background.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--white);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 3px solid var(--accent-cyan);
            outline-offset: 3px;
        }

        /* ── Card ── */
        .menu-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .logo-wrapper {
            margin-bottom: 20px;
        }

        .city-seal {
            width: 96px;
            height: 96px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
            transition: var(--transition);
        }

        .city-seal:hover {
            transform: scale(1.06) rotate(2deg);
        }

        .brand-title {
            font-weight: 900;
            font-size: clamp(2.2rem, 9vw, 3.2rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .brand-title .blue-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
        }

        .brand-title .white-text {
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .sub-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 36px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ── Buttons ── */
        .action-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            width: 100%;
            padding: 16px 28px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--white);
            background: var(--light-blue);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .menu-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .menu-btn:hover {
            background: var(--btn-hover-blue);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .menu-btn:hover svg {
            transform: scale(1.15);
        }

        .menu-btn:active {
            transform: translateY(-1px);
        }

        /* Raised contrast: a lighter blue nearly vanishes on the glass card */
        .menu-btn.alt-btn {
            background: var(--primary-blue);
            box-shadow: 0 10px 20px -5px rgba(14, 72, 161, 0.5);
        }

        .menu-btn.alt-btn:hover {
            background: #0b3a85;
            box-shadow: 0 15px 25px -5px rgba(14, 72, 161, 0.7);
        }

        @media (max-width: 480px) {
            .menu-card {
                padding: 36px 24px;
            }

            .sub-title {
                font-size: 0.72rem;
                letter-spacing: 0.14em;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="menu-card">
        <div class="logo-wrapper">
            <img src="pasig_logo.webp" alt="Pasig City Seal" class="city-seal" width="96" height="96">
        </div>

        <h1 class="brand-title">
            <span class="blue-text">Pasig</span> <span class="white-text">Tugon!</span>
        </h1>
        <p class="sub-title">Citizen Concern Station</p>

        <nav class="action-group" aria-label="Main menu">
            <a href="Sign_In.html" class="menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Sign In
            </a>

            <a href="Sign_Up.html" class="menu-btn alt-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
                Sign Up
            </a>
        </nav>

    </main>

    <script>
        // Hide the seal gracefully if the image file is missing
        (function () {
            var seal = document.querySelector('.city-seal');
            if (!seal) return;
            seal.addEventListener('error', function () {
                seal.style.display = 'none';
            });
        })();
    </script>
</body>

</html>
