<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasig Tugon! - Citizen Concern Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        :root {
            --primary-blue: #0e48a1;
            --light-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --btn-hover-blue: #1d4ed8;
            --white: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Updated to use local background.png with color overlay */
            background: url('background.png') center/cover no-repeat fixed;
            color: var(--white);
            padding: 20px;
        }

        /* CARD CONTAINER WITH GLASSMORPHISM */
        .menu-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 50px 40px;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* CITY SEAL LOGO */
        .city-seal {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
            transition: var(--transition);
        }

        .city-seal:hover {
            transform: scale(1.05);
        }

        /* BRANDING TITLES */
        .brand-title {
            font-weight: 900;
            font-size: clamp(3rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .brand-title .blue-text {
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .brand-title .white-text {
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .sub-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* NAVIGATION BUTTONS */
        .action-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            width: 100%;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--white);
            background: var(--light-blue);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            display: inline-block;
        }

        .menu-btn:hover {
            background: var(--btn-hover-blue);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .menu-btn:active {
            transform: translateY(-1px);
        }

        .menu-btn.admin-btn {
            background: rgba(14, 72, 161, 0.8);
            box-shadow: 0 10px 20px -5px rgba(14, 72, 161, 0.3);
        }

        .menu-btn.admin-btn:hover {
            background: var(--primary-blue);
            box-shadow: 0 15px 25px -5px rgba(14, 72, 161, 0.5);
        }

        .ui-dialog .ui-dialog-buttonpane {
            background: #fff !important;
            border: none !important;
            padding: 0 24px 24px !important;
            margin: 0 !important;
        }

        .ui-dialog .ui-dialog-buttonpane .ui-dialog-buttonset {
            float: none !important;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .ui-dialog .ui-dialog-buttonpane button {
            width: 100% !important;
            padding: 12px 24px !important;
            font-family: inherit !important;
            font-size: 1rem !important;
            font-weight: 700 !important;
            color: #fff !important;
            background: #0e48a1 !important;
            border: none !important;
            border-radius: 12px !important;
            cursor: pointer;
            margin: 0 !important;
            box-shadow: 0 4px 12px rgba(11, 69, 172, 0.2) !important;
        }

        .ui-dialog .ui-dialog-buttonpane button:hover {
            background: #1d4ed8 !important;
        }

        .ui-dialog-titlebar {
            display: none !important;
        }

        @media (max-width: 480px) {
            .menu-card {
                padding: 36px 24px;
            }

            .sub-title {
                font-size: 0.85rem;
                letter-spacing: 0.12em;
            }
        }
    </style>
</head>

<body>
    <div id="account-created-dialog" title="Pasig Tugon!" style="display:none;">
        <div class="custom-dialog-content" style="padding:16px 24px 24px;text-align:center;">
            <div style="width:64px;height:64px;background:#ecfdf5;color:#10b981;border-radius:50%;
                    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 style="font-weight:800;font-size:1.4rem;color:#0f172a;margin-bottom:8px;">
                Account Created!
            </h2>
            <p style="font-size:0.95rem;color:#64748b;line-height:1.6;">
                Your admin account has been successfully created.<br>
                Click the <strong>Admin</strong> button below to log in.
            </p>
        </div>
    </div>

    <main class="menu-card">
        <!-- City Seal Logo -->
        <img src="pasig_logo.webp" alt="Pasig City Seal" class="city-seal">

        <!-- Title Header -->
        <h1 class="brand-title">
            <span class="blue-text">PASIG</span> <span class="white-text">TUGON!</span>
        </h1>
        <p class="sub-title">Citizen Concern Station</p>

        <!-- Role Selection Buttons -->
        <div class="action-group">
            <a href="citizen_concern_station.html" class="menu-btn">Citizens</a>
            <a href="Admin_Log_In.html" class="menu-btn admin-btn">Admin</a>
        </div>
    </main>

    <script>
        // Reuse the same dialog button styles from signup page
        const style = document.createElement('style');

        document.head.appendChild(style);

        $(document).ready(function () {
            $("#account-created-dialog").dialog({
                autoOpen: false,
                modal: true,
                resizable: false,
                draggable: false,
                width: 400,
                show: { effect: "fade", duration: 200 },
                hide: { effect: "fadeOut", duration: 150 },
                buttons: {
                    "Got it": function () {
                        $(this).dialog("close");
                    }
                }
            });

            // Check if admin just registered
            if (localStorage.getItem("adminJustRegistered") === "true") {
                localStorage.removeItem("adminJustRegistered"); // clear immediately
                $("#account-created-dialog").dialog("open");
            }
        });
    </script>

</body>

</html>
